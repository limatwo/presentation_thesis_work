<svg width="100%" viewBox="0 0 680 900" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Behavior-aware model selection flowchart</title>
  <desc>Flowchart from candidate model set through standard selection, mismatch detection, behavior-aware metric, and verification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. Candidate model set -->
  <rect x="190" y="30" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489" x="340" y="52" text-anchor="middle" dominant-baseline="central">Candidate model set Θ</text>
  <text font-family="sans-serif" font-size="12" fill="#534AB7" x="340" y="72" text-anchor="middle" dominant-baseline="central">θ₁, θ₂, …, θₘ</text>

  <!-- Arrow -->
  <line x1="340" y1="86" x2="340" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. For each model -->
  <rect x="190" y="118" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="340" y="140" text-anchor="middle" dominant-baseline="central">For each θ ∈ Θ</text>
  <text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="160" text-anchor="middle" dominant-baseline="central">compute fθ : X → Y (sensor → labels)</text>

  <!-- Arrow -->
  <line x1="340" y1="174" x2="340" y2="206" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Standard selection -->
  <rect x="190" y="206" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="340" y="228" text-anchor="middle" dominant-baseline="central">Standard selection</text>
  <text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="248" text-anchor="middle" dominant-baseline="central">θ*_metric = argmax mIoU(θ)</text>

  <!-- Arrow -->
  <line x1="340" y1="262" x2="340" y2="294" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Decision diamond -->
  <polygon points="340,294 450,350 340,406 230,350" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#412402" x="340" y="344" text-anchor="middle" dominant-baseline="central">Mismatch?</text>
  <text font-family="sans-serif" font-size="12" fill="#633806" x="340" y="364" text-anchor="middle" dominant-baseline="central">θ*_metric ≠ θ*</text>

  <!-- NO branch left -->
  <line x1="230" y1="350" x2="110" y2="350" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="#3B6D11" x="170" y="338" text-anchor="middle">No</text>
  <rect x="20" y="322" width="90" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#173404" x="65" y="344" text-anchor="middle" dominant-baseline="central">θ*_metric</text>
  <text font-family="sans-serif" font-size="11" fill="#27500A" x="65" y="362" text-anchor="middle" dominant-baseline="central">sufficient</text>

  <!-- YES branch down -->
  <line x1="340" y1="406" x2="340" y2="438" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="#A32D2D" x="356" y="425" text-anchor="start">Yes</text>

  <!-- 5. Compute U(θ) -->
  <rect x="190" y="438" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" x="340" y="460" text-anchor="middle" dominant-baseline="central">Compute behavioral risk U(θ)</text>
  <text font-family="sans-serif" font-size="12" fill="#712B13" x="340" y="480" text-anchor="middle" dominant-baseline="central">Expected cost via matrix C ∈ ℝᴷˣᴷ</text>

  <!-- Arrow -->
  <line x1="340" y1="494" x2="340" y2="526" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Behavior-aware metric -->
  <rect x="190" y="526" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" x="340" y="548" text-anchor="middle" dominant-baseline="central">Behavior-aware metric M_beh</text>
  <text font-family="sans-serif" font-size="12" fill="#712B13" x="340" y="568" text-anchor="middle" dominant-baseline="central">wk ∝ 1/πk — rare classes upweighted</text>

  <!-- Arrow -->
  <line x1="340" y1="582" x2="340" y2="614" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Behavior-aware selection -->
  <rect x="190" y="614" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489" x="340" y="636" text-anchor="middle" dominant-baseline="central">Behavior-aware selection</text>
  <text font-family="sans-serif" font-size="12" fill="#534AB7" x="340" y="656" text-anchor="middle" dominant-baseline="central">θ*_beh = argmax M_beh(θ)</text>

  <!-- Arrow -->
  <line x1="340" y1="670" x2="340" y2="702" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. Verify -->
  <rect x="190" y="702" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" x="340" y="724" text-anchor="middle" dominant-baseline="central">Verify alignment</text>
  <text font-family="sans-serif" font-size="12" fill="#085041" x="340" y="744" text-anchor="middle" dominant-baseline="central">|ρ(M_beh, −U)| > |ρ(M, −U)|</text>

  <!-- Arrow -->
  <line x1="340" y1="758" x2="340" y2="790" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Outcome -->
  <rect x="190" y="790" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" x="340" y="812" text-anchor="middle" dominant-baseline="central">Safer off-road perception</text>
  <text font-family="sans-serif" font-size="12" fill="#085041" x="340" y="832" text-anchor="middle" dominant-baseline="central">Metric aligned with real-world behavior</text>

</svg>

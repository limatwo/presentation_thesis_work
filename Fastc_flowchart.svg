  <text
     x="780"
     y="570"
     text-anchor="middle"
     class="small"
     id="text18">1. Encoder with dilated blocks</text>
  <text
     x="780"
     y="595"
     text-anchor="middle"
     class="small"
     id="text19">2. Lightweight decoder</text>
  <text
     x="780"
     y="620"
     text-anchor="middle"
     class="small"
     id="text20">3. Fill sparse / empty / unknown regions</text>
  <text
     x="780"
     y="645"
     text-anchor="middle"
     class="small"

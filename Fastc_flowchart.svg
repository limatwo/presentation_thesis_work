  <text
     x="550"
     y="310"
     text-anchor="middle"
     class="small"
     id="text8">3. PointNet-based pillar encoding</text>
  <text
     x="550"
     y="333"
     text-anchor="middle"
     class="small"
     id="text9">4. Scatter pillar features into BEV pseudo-image / feature map</text>

  <text
     x="320"
     y="595"
     text-anchor="middle"
     class="small"
     id="text13">2. Channel attention</text>
  <text
     x="320"
     y="620"
     text-anchor="middle"
     class="small"
     id="text14">3. Spatial attention</text>
  <text
     x="320"
     y="645"
     text-anchor="middle"
     class="small"
     id="text15">4. Concatenate attended features</text>
  <text
     x="320"
     y="670"
     text-anchor="middle"
     class="small"
     id="text16">5. 1x1 convolution → fused feature map</text>
